# ===================================================================
#  Nginx 站点配置 —— 部署到阿里云轻量应用服务器时使用
#
#  使用方法：
#    1. 把仓库上传到服务器，例如 /var/www/kimic
#    2. 把本文件复制到 /etc/nginx/conf.d/kimic.conf
#    3. 把下面的 your-domain.com 全部换成你自己的域名
#       （还没有域名的话，删掉 server_name 里带域名的整段，
#         只保留第一个默认 server 即可用 IP 访问）
#    4. nginx -t  &&  systemctl reload nginx
# ===================================================================

# ---------- HTTP：默认站点（用 IP 或域名都能进） ----------
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  your-domain.com www.your-domain.com _;

    root   /var/www/kimic;
    index  index.html;

    charset utf-8;

    # 访问日志
    access_log /var/log/nginx/kimic.access.log;
    error_log  /var/log/nginx/kimic.error.log;

    # ---------- 静态资源缓存策略 ----------
    # HTML 不缓存，改完立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带指纹的静态资源可以长期缓存（当前项目用了 ?v= 或直接靠协商缓存）
    location ~* \.(css|js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate" always;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 如果以后要挂 CDN 或统计脚本，再按需放宽下面这条
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # ---------- 找不到页面 ----------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 禁止访问隐藏文件（.git、.env 之类）
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

