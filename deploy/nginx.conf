# ===================================================================
#  Nginx 站点配置（模板）—— Kimi Chen 个人主页
#
#  ⚠️ 这是**模板**：__PORT__ 和 __SERVER_NAME__ 两个占位符由
#     deploy/setup-server.sh 渲染成真正的配置。
#     不要直接 cp 进 /etc/nginx/，__PORT__ 不是合法端口，nginx -t 会报错。
#
#  为什么默认不占 80 端口：
#     目标服务器 47.82.233.199 上已经有别的站点在跑 —— 用 http 访问
#     会被 301 跳到 https，说明 80 端口上已经有一个 default_server。
#     nginx 只允许一个 default_server 监听同一端口，硬加上去会
#     "a duplicate default server for 0.0.0.0:80" 启动失败，
#     还可能把别人正在跑的站点搞挂。
#     所以这个站点只监听一个**独立端口**，和已有站点互不干扰。
#
#  想用域名（新加坡地域不需要备案，解析生效即可）：
#     bash /var/www/kimic/deploy/setup-server.sh --domain example.com --https
# ===================================================================

server {
    listen       __PORT__;
    server_name  __SERVER_NAME__;

    root   /var/www/kimic;
    index  index.html;

    charset utf-8;

    access_log /var/log/nginx/kimic.access.log;
    error_log  /var/log/nginx/kimic.error.log;

    # ---------- 静态资源缓存策略 ----------
    # HTML 不缓存，改完立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 样式和脚本短期缓存
    location ~* \.(css|js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate" always;
    }

    # 图片、字体长期缓存
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 如果以后要挂 CDN 或统计脚本，再按需放宽下面这条
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # ---------- 找不到页面 ----------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 禁止访问隐藏文件（.git、.env 之类）
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

# ===================================================================
#  说明：这份配置**不会**碰 /etc/nginx/sites-enabled/default，
#  也不会声明 default_server，所以和服务器上已有的站点可以共存。
#
#  以后有了域名，用这条命令换成域名版（会生成新的 listen 80 段，
#  并让 certbot 自动补上 443 与证书续期）：
#      bash /var/www/kimic/deploy/setup-server.sh --domain example.com --https
# ===================================================================
